<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gata Blood Bowl League Reference</title>
    <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <!-- Runs before the stylesheet paints, so a chosen light theme never flashes dark. -->
    <script src="src/theme-boot.js?v=gata-63"></script>
    <link rel="preload" as="image" href="assets/brand/gata-league-logo-96.png" fetchpriority="high">
    <!-- The faces the first screen paints with: body text, labels and tabs, the team's name in the header (600), headings. -->
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/golos-text-cyrillic-400-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/golos-text-cyrillic-600-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/golos-text-latin-400-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/golos-text-latin-600-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/oswald-cyrillic-600-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/oswald-latin-600-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/oswald-cyrillic-700-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/ui/oswald-latin-700-normal.woff2" crossorigin>
    <link rel="stylesheet" href="assets/fonts/ui/fonts.css?v=gata-63">
    <!-- A plain stylesheet link, not preload plus an onload swap: that swap was
         inline JavaScript, and the Content-Security-Policy no longer allows any
         (step 17.5). Render-blocking CSS also cannot flash unstyled content. -->
    <link rel="stylesheet" href="src/styles.css?v=gata-63">
  </head>
  <body>
    <!-- First tab stop: the header's tabs or the SideNav's items stand between
         the top of the page and the content, and a keyboard had to walk all
         of them. A button, not a link: an href="#app-view" would rewrite the
         hash, and the hash is what the router reads. -->
    <button class="skip-link" type="button" data-skip-to-content data-i18n="a11y.skipToContent">Skip to content</button>
    <!--
      The 3.0 frame, empty until src/shell/shell.mjs draws it for the route:
      the SideNav from 901px, the header up to 900px, the footer line under the
      content up to 900px (the SideNav carries it on a desktop). Sizes and
      breakpoints are src/shell/frame.css's. The 2.x search stays as a strip
      over the content on the reference lists until stage 11.
    -->
    <div class="g-frame" id="app-frame" data-shell="guest">
      <aside class="g-sidenav" id="side-nav" aria-label="Navigation" data-i18n-aria-label="nav.navigationAria"></aside>
      <div class="g-frame__main">
        <header class="g-appbar" id="app-header"></header>
        <main class="g-main" id="app-main">
          <div class="g-searchbar" id="ref-search" hidden>
            <svg class="g-searchbar__icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="m21 21-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"></path>
            </svg>
            <input id="global-search" class="g-searchbar__input" type="search" placeholder="Search teams, skills, rules..." data-i18n-placeholder="search.placeholder" autocomplete="off">
          </div>
          <section id="app-view" class="view" tabindex="-1">
            <div class="loading">Loading reference...</div>
          </section>
          <footer class="g-main__footer" id="site-footer"></footer>
        </main>
      </div>
    </div>

    <script type="module" src="src/app.js?v=gata-97"></script>
  </body>
</html>
