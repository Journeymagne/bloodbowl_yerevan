<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gata Blood Bowl League Reference</title>
    <!-- Runs before the stylesheet paints, so a chosen light theme never flashes dark. -->
    <script src="src/theme-boot.js?v=gata-63"></script>
    <link rel="preload" as="image" href="assets/brand/gata-league-logo-96.png" fetchpriority="high">
    <!-- A plain stylesheet link, not preload plus an onload swap: that swap was
         inline JavaScript, and the Content-Security-Policy no longer allows any
         (step 17.5). Render-blocking CSS also cannot flash unstyled content. -->
    <link rel="stylesheet" href="src/styles.css?v=gata-63">
  </head>
  <body>
    <!-- THESIS: A club competition journal that puts player tasks first.
    OWN-WORLD: Navy, cool white, copper; Oswald headings and Golos Text; solid surfaces.
    STORY: Find the season, open a match, manage a team, consult a rule.
    FIRST VIEWPORT: Compact masthead; season workspace left, team and rules right; mobile stacks.
    FORM: Club annual / competition programme, candidate 5, seed 22546323; user selected.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md -->
    <!-- First tab stop: 44 navigation links stand between the top of the page
         and the content, and a keyboard had to walk all of them. A button, not
         a link: an href="#app-view" would rewrite the hash, and the hash is
         what the router reads. -->
    <button class="skip-link" type="button" data-skip-to-content data-i18n="a11y.skipToContent">Skip to content</button>
    <div class="app-shell">
      <aside id="site-sidebar" class="sidebar" aria-label="Navigation" data-i18n-aria-label="nav.label">
        <div class="nav-brand-row">
          <button class="nav-close icon-close" data-nav-close type="button" aria-label="Close menu" data-i18n-aria-label="nav.closeMenu" title="Close menu" data-i18n-title="nav.closeMenu">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg>
          </button>
        <a class="brand" href="#/">
          <span class="brand-mark">
            <img src="assets/brand/gata-league-logo-96.png" width="48" height="48" alt="" decoding="async" fetchpriority="high">
          </span>
          <span>
            <strong>Gata League</strong>
            <small>Blood Bowl Sevens</small>
          </span>
        </a>
        </div>

        <nav class="nav-list">
          <a href="#/" data-nav="home" data-i18n="nav.home">Home</a>
          <a href="#/season" data-nav="season" data-i18n="nav.season">Season</a>
          <a href="#/my-games" data-nav="my-games" data-i18n="nav.myGames">My Games</a>
          <a href="#/my-teams" data-nav="my-teams" data-i18n="nav.myTeams">My Teams</a>
          <a href="#/pages" data-nav="pages" data-i18n="nav.references">References</a>
          <a href="#/administration" data-nav="administration" data-admin-nav hidden data-i18n="nav.administration">Administration</a>
        </nav>


        <div class="nav-settings">
            <label class="theme-picker" title="Theme" data-i18n-title="theme.label">
              <span data-i18n="theme.label">Theme</span>
              <select id="theme-select" aria-label="Theme" data-i18n-aria-label="theme.label">
                <option value="dark-gata">Gata Dark</option>
                <option value="dark-dugout">Dugout Dark</option>
                <option value="dark-warpstone">Warpstone Dark</option>
                <option value="light-parchment">Parchment Light</option>
                <option value="light-sideline">Sideline Light</option>
                <option value="light-altdorf">Altdorf Light</option>
              </select>
            </label>
            <button id="lang-toggle" class="icon-text-button" type="button" title="Switch to Russian">EN</button>
        </div>
      </aside>
      <button id="nav-overlay" class="nav-overlay" type="button" aria-label="Close menu" data-i18n-aria-label="nav.closeMenu" tabindex="-1"></button>

      <main class="main">
        <header class="topbar">
          <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Open menu" data-i18n-aria-label="nav.openMenu" aria-controls="site-sidebar" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16"></path>
            </svg>
          </button>
          <a class="mobile-brand" href="#/">Gata League</a>
          <div class="search-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m21 21-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"></path>
            </svg>
            <input id="global-search" type="search" aria-label="Search reference" data-i18n-aria-label="search.label" placeholder="Search teams, skills, rules..." data-i18n-placeholder="search.placeholder" autocomplete="off">
          </div>
          <div class="top-actions">
            <button id="auth-button" class="icon-text-button auth-button" type="button" data-i18n="auth.login">Login</button>

          </div>
        </header>

        <section id="app-view" class="view" tabindex="-1">
          <div class="loading" data-i18n="footer.loadingData">Loading reference...</div>
        </section>
        <div class="site-footer">
          <span id="generated-at" data-i18n="footer.loadingData">Loading data</span>
          <p class="legal-note">
            <span data-i18n="footer.unofficialNote">Unofficial fan-made league reference.</span>
            <a href="#/legal" data-nav="legal" data-i18n="footer.legalLink">Legal Information</a>
          </p>
        </div>
      </main>
    </div>

    <div id="auth-modal" class="auth-modal" hidden role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <button class="auth-backdrop" type="button" data-auth-close tabindex="-1" aria-label="Close authorization" data-i18n-aria-label="auth.closeAriaLabel"></button>
      <section class="auth-dialog">
        <header>
          <h2 id="auth-title" data-i18n="auth.login">Login</h2>
          <button class="icon-close" type="button" data-auth-close aria-label="Close authorization" data-i18n-aria-label="auth.closeAriaLabel" title="Close" data-i18n-title="auth.close">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg>
          </button>
        </header>

        <div id="auth-account" class="auth-account" hidden>
          <p id="auth-account-text"></p>
          <form id="auth-profile-form" class="auth-form">
            <label class="filter-field">
              <span data-i18n="auth.loginField">Login</span>
              <input name="login" autocomplete="username" required>
            </label>
            <label class="filter-field">
              <span data-i18n="auth.telegramField">Telegram contact</span>
              <input name="telegram" autocomplete="off" required>
            </label>
            <label class="filter-field">
              <span data-i18n="auth.newPasswordField">New password</span>
              <input name="password" type="password" autocomplete="new-password" placeholder="Leave empty to keep current" data-i18n-placeholder="auth.newPasswordPlaceholder">
            </label>
            <button class="primary-button" type="submit" data-i18n="auth.saveProfile">Save profile</button>
          </form>
          <button id="auth-logout" class="primary-button" type="button" data-i18n="auth.logout">Log out</button>
        </div>

        <form id="auth-form" class="auth-form">
          <label class="filter-field">
            <span data-i18n="auth.loginField">Login</span>
            <input name="login" autocomplete="username" required>
          </label>
          <label class="filter-field">
            <span data-i18n="auth.passwordField">Password</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <label class="filter-field" data-auth-telegram>
            <span data-i18n="auth.telegramField">Telegram contact</span>
            <input name="telegram" autocomplete="off" placeholder="@username">
          </label>
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
          <button id="auth-submit" class="primary-button" type="submit" data-i18n="auth.signIn">Sign in</button>
          <div class="auth-switch-row">
            <span id="auth-switch-hint" data-i18n="auth.noAccount">No account yet?</span>
            <button id="auth-switch" class="auth-switch" type="button" data-i18n="auth.createAccount">Create account</button>
          </div>
        </form>
      </section>
    </div>

    <script type="module" src="src/app.js?v=gata-97"></script>
  </body>
</html>
