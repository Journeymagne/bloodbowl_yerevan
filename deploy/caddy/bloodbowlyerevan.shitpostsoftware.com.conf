# Snippet to append to the shared Caddyfile at
# /home/deploy/painting-evenings/Caddyfile on 51.81.86.51 (the same Caddy
# container already serves paint.shitpostsoftware.com). 172.18.0.1 is that
# Caddyfile's docker-compose project's bridge gateway
# (`docker network inspect paint-day-tracker-prod_default`) — re-check this
# IP if that network is ever recreated, since Docker does not guarantee it
# stays the same.
bloodbowlyerevan.shitpostsoftware.com {
    header {
        X-Content-Type-Options "nosniff"
        Referrer-Policy "strict-origin-when-cross-origin"
        Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        # Enforcing since step 17.5. The theme bootstrap moved to
        # src/theme-boot.js and the stylesheet swap became a plain link, so
        # nothing on the page runs inline any more and script-src can refuse
        # it. Nothing sets a style attribute either, so style-src is 'self'
        # too - checked against the built site under this exact policy, with no
        # violations, in both a stored theme and the system one.
        Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"
        -Server
    }
    reverse_proxy 172.18.0.1:3002
}
