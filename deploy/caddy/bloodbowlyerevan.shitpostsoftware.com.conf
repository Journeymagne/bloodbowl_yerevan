# Snippet to append to the shared Caddyfile at
# /home/deploy/painting-evenings/Caddyfile on 51.81.86.51 (the same Caddy
# container already serves paint.shitpostsoftware.com). 172.18.0.1 is that
# Caddyfile's docker-compose project's bridge gateway
# (`docker network inspect paint-day-tracker-prod_default`) — re-check this
# IP if that network is ever recreated, since Docker does not guarantee it
# stays the same.
bloodbowlyerevan.shitpostsoftware.com {
    header {
        X-Content-Type-Options "nosniff"
        Referrer-Policy "strict-origin-when-cross-origin"
        Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        # Report-only first: index.html still has an inline theme script, so a
        # blocking policy would break the page until that script moves out.
        Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"
        -Server
    }
    reverse_proxy 172.18.0.1:3002
}
