name: gata-postgres

services:
  postgres:
    image: postgres:16
    container_name: gata-league-postgres
    restart: unless-stopped
    # No env_file: the container needs three variables, not the whole file of
    # secrets. On the server the values come from the env file outside the
    # served directory, passed explicitly:
    #   docker compose --env-file /etc/bloodbowl-league/.env up -d
    # Locally compose picks up ./.env on its own.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      # Bind to loopback only: the database must never be reachable from the
      # public internet. Use an SSH tunnel for remote access.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gata_admin} -d ${POSTGRES_DB:-gata_league}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gata_postgres_data:
