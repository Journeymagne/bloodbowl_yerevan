name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import fs from 'node:fs/promises';
            import { execFileSync } from 'node:child_process';
            import { pool } from './server/db/pool.mjs';
            try {
              const targets = await pool.query(`SELECT u.id AS coach_id,u.login,t.id AS team_id,t.name AS team_name,t.base_team_slug,
                se.id AS entry_id,s.id AS season_id,s.name AS season FROM saved_teams t JOIN users u ON u.id=t.user_id
                LEFT JOIN season_entries se ON se.saved_team_id=t.id LEFT JOIN seasons s ON s.id=se.season_id
                WHERE t.base_team_slug ILIKE '%tomb%' OR t.base_team_slug ILIKE '%gnome%' ORDER BY u.login`);
              const seasons = await pool.query(`SELECT s.id,s.name,s.status,count(DISTINCT e.id)::int AS entries,count(DISTINCT p.id)::int AS matches
                FROM seasons s LEFT JOIN season_entries e ON e.season_id=s.id LEFT JOIN season_rounds r ON r.season_id=s.id
                LEFT JOIN season_pairings p ON p.round_id=r.id GROUP BY s.id ORDER BY s.created_at`);
              const migrations = await pool.query('SELECT name FROM schema_migrations ORDER BY name');
              const directory = '/var/backups/bloodbowl-league';
              const backups = await Promise.all((await fs.readdir(directory)).filter(name => name.endsWith('.dump')).map(async name => {
                const info = await fs.stat(directory + '/' + name); return {name,bytes:info.size,modified:info.mtime.toISOString()};
              })).catch(error => [{error:error.code}]);
              console.log('RECOVERY_DATA ' + JSON.stringify({commit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
                targets:targets.rows,seasons:seasons.rows,migrations:migrations.rows,backups}));
            } finally { await pool.end(); }
            NODE
