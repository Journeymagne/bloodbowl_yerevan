name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import { execFileSync } from 'node:child_process';
            import { pool } from './server/db/pool.mjs';
            try {
              const migrations=(await pool.query("SELECT *,xmin::text AS transaction_id FROM schema_migrations ORDER BY name")).rows;
              const rewritten=(await pool.query("SELECT id,home_touchdowns,away_touchdowns,home_casualties,away_casualties,home_points,away_points,updated_at,xmin::text AS transaction_id FROM season_pairings WHERE xmin='3105'::xid ORDER BY id")).rows;
              const files=execFileSync('find',['/var/backups','/root','/opt/bloodbowl-league','-maxdepth','3','-type','f','(',
                '-iname','*.dump','-o','-iname','*.backup','-o','-iname','*.sql','-o','-iname','*.sql.gz','-o','-iname','*season*.json',')','-printf','%p %s bytes\n'],{encoding:'utf8',timeout:30000}).trim().split('\n');
              const logs=(await pool.query("SELECT name,setting FROM pg_settings WHERE name IN ('logging_collector','log_statement','log_min_duration_statement')")).rows;
              console.log('RECOVERY_DATA '+JSON.stringify({migrations,rewritten,files,logs}));
            }finally{await pool.end();}
            
            NODE
