name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { loadSeasonBundle } from './server/season/store.mjs';
            import { pool } from './server/db/pool.mjs';
            try {
              const targets=new Set(['5743ec4d-aea1-4b32-a92a-5f3ac4ddfdc6','b06d2c69-8218-47c9-8e94-b08a22ee45c3']);
              const data=await loadSeasonBundle();
              const restored=data.standings.filter(row=>targets.has(row.user.id));
              assert.equal(restored.length,2);
              assert.ok(restored.every(row=>row.withdrawnAt && row.games>0));
              assert.ok(data.entries.every(row=>!targets.has(row.user.id)));
              const ids=new Set(restored.map(row=>row.entryId));
              const matches=data.rounds.flatMap(round=>round.pairings).filter(pair=>ids.has(pair.homeEntryId)||ids.has(pair.awayEntryId));
              assert.equal(matches.length,4);
              console.log('RECOVERY_DATA '+JSON.stringify({verified:true,restoredParticipants:2,restoredMatches:4,activeParticipants:data.entries.length}));
            } finally {await pool.end();}

            NODE
