name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import { execFileSync } from 'node:child_process';
            import { pool } from './server/db/pool.mjs';
            try {
              const storage = (await pool.query(`SELECT c.relname,pg_relation_filepath(c.oid) AS file,pg_relation_size(c.oid)::int AS bytes,
                s.n_live_tup,s.n_dead_tup,s.last_vacuum,s.last_autovacuum FROM pg_class c JOIN pg_stat_user_tables s ON s.relid=c.oid
                WHERE c.relname IN ('season_entries','season_pairings','match_preparations','match_roster_snapshots','match_treasury_spends','match_post_games','match_post_applications')`)).rows;
              const extensions = (await pool.query("SELECT name,installed_version FROM pg_available_extensions WHERE name IN ('pageinspect','pg_dirtyread')")).rows;
              const privileges = (await pool.query('SELECT rolsuper FROM pg_roles WHERE rolname=current_user')).rows;
              const archives = execFileSync('find',['/var/backups','/root','/opt/bloodbowl-league','-maxdepth','3','-type','f','(','-iname','*gata*.dump','-o','-iname','*bloodbowl*.dump','-o','-iname','*gata*.sql*','-o','-iname','*bloodbowl*.sql*',')','-printf','%p %s bytes\n'],{encoding:'utf8',timeout:30000}).trim().split('\n');
              console.log('RECOVERY_DATA ' + JSON.stringify({storage,extensions,privileges,archives}));
            } finally { await pool.end(); }

            NODE
