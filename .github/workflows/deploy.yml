name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import fs from 'node:fs/promises';
            import { pool } from './server/db/pool.mjs';
            try {
              const directory='/var/backups/bloodbowl-league/snotling-history-scan-20261023';
              const needle=Buffer.from('0d2df1fb53ba4e05a1a8cdb054f8e4d2','hex');
              const files=[];
              for(const name of (await fs.readdir(directory)).filter(name=>name.endsWith('.bin'))) {
                const bytes=await fs.readFile(directory+'/'+name),offsets=[];
                for(let at=bytes.indexOf(needle);at!==-1;at=bytes.indexOf(needle,at+1))offsets.push(at);
                files.push({name,offsets});
              }
              const tables=(await pool.query(`SELECT table_name FROM information_schema.columns WHERE table_schema='public'
                AND (column_name ILIKE '%entry_id%' OR column_name='pairing_id') GROUP BY table_name ORDER BY table_name`)).rows;
              const timestamps=(await pool.query(`SELECT id,name,base_team_slug,created_at,updated_at FROM saved_teams WHERE id IN
                ('239e7fe0-8799-4fda-b5d1-3ed9d2be5871','8547f9e2-5ad9-4b91-a0f0-56311a34bbcc')`)).rows;
              console.log('RECOVERY_DATA '+JSON.stringify({files,tables,timestamps}));
            }finally{await pool.end();}
            
            NODE
