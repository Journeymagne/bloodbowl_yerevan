name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import crypto from 'node:crypto';
            import { execFileSync } from 'node:child_process';
            import { pool } from './server/db/pool.mjs';
            import { scoreLeagueResult } from './server/season/scoring.mjs';
            
            const APPLY = true;
            const dir = '/var/backups/bloodbowl-league/snotling-history-tuples-20261023';
            const entryId = '0d2df1fb-53ba-4e05-a1a8-cdb054f8e4d2';
            const seasonId = '3b147bf3-31b5-4ebb-8fb3-76d66d5dbfa3';
            const darkElfId = 'e26605d5-4da2-4c47-b05d-a9520448bbea';
            const ids = ['db1117f0-2a10-45e5-85f9-d268002569d2', '618aa388-0a10-4a97-9f13-f9e06bd881e4'];
            const read = async name => JSON.parse(await fs.readFile(`${dir}/${name}`, 'utf8'));
            const hash = value => crypto.createHash('sha256').update(typeof value === 'string' ? value : JSON.stringify(value)).digest('hex');
            let client;
            let committed = false;
            try {
              const incident = await read('incident-records.json');
              const decoded = await read('decoded-fragments.json');
              assert.equal(incident.source.sha256, '013d801ba37329405f6f6dac5abb6c235fa153bc9e39f7d7abde6cd615e07401');
              assert.equal(hash(await fs.readFile(incident.source.file, 'utf8')), incident.source.sha256);
              assert.equal(decoded.validated, 28);
              const recovered = decoded.found.filter(row => row.xmin === 3081 && row.xmax === 3105 && row.start === 2080);
              assert.equal(recovered.length, 2);
              assert.deepEqual(new Set(recovered.map(row => row.origin)), new Set(['current', 'archive']));
              assert.deepEqual(recovered[0].row, recovered[1].row);
              for (const source of recovered) assert.equal(source.status.xmin, 'committed');
              const entry = incident.entries.find(row => row.id === entryId);
              assert.equal(entry.season_id, seasonId);
              assert.equal(entry.user_id, '3556860a-fe0f-4980-964c-ccfa64b394ff');
              assert.equal(entry.saved_team_id, '239e7fe0-8799-4fda-b5d1-3ed9d2be5871');
              const pairs = [structuredClone(incident.pairs.find(row => row.id === ids[0])), structuredClone(recovered[0].row)];
              // The August SQL dump preserves the original creation timestamp at microsecond precision.
              pairs[1].created_at = incident.pairs.find(row => row.id === ids[1]).created_at;
              const expected = [
                ['002e1935-8f84-463b-ba2b-d9f716f2c403', 'cbb8b652-637d-47ce-a267-7c9bfb2e3a82', 2, 0, 2, 1, 4, 0],
                ['89f24dd7-a340-4d95-b8eb-a33b94997f58', 'd72f5b1c-34c7-4dd3-bff7-ba4489567d08', 0, 1, 3, 2, 1, 4],
              ];
              const scoreKeys = ['home_touchdowns', 'away_touchdowns', 'home_casualties', 'away_casualties'];
              for (const [index, pair] of pairs.entries()) {
                assert.equal(pair.id, ids[index]);
                assert.equal(pair.away_entry_id, entryId);
                assert.equal(pair.result_type, 'played');
                assert.equal(pair.result_status, 'confirmed');
                assert.deepEqual([pair.round_id, pair.home_entry_id, ...scoreKeys.map(key => Number(pair[key]))], expected[index].slice(0, 6));
                for (const key of [...scoreKeys, 'table_number', 'proposed_home_touchdowns', 'proposed_away_touchdowns', 'proposed_home_casualties', 'proposed_away_casualties']) {
                  if (pair[key] != null) pair[key] = Number(pair[key]);
                }
                const points = scoreLeagueResult({ homeTouchdowns: pair.home_touchdowns, awayTouchdowns: pair.away_touchdowns,
                  homeCasualties: pair.home_casualties, awayCasualties: pair.away_casualties, kind: 'league', resultType: 'played' });
                assert.deepEqual([points.homePoints, points.awayPoints], expected[index].slice(6));
                pair.home_points = points.homePoints;
                pair.away_points = points.awayPoints;
                pair.match_kind = 'league';
                pair.preparation_status = 'not_started';
              }
              const migration = (await pool.query("SELECT checksum, xmin::text AS transaction_id FROM schema_migrations WHERE name = '004_recalculate_active_season_points.sql'")).rows[0];
              assert.deepEqual(migration, { checksum: '6de364661b146f550b1d271b2d716532b488b9699f78ad08d3b0d38cb4057e72', transaction_id: '3105' });
              let backup = null;
              if (APPLY) {
                backup = execFileSync('node', ['scripts/backup-db.mjs', '--label', 'before-snotling-restore'], {
                  env: { ...process.env, BACKUP_DIR: `${dir}/before-restore` }, encoding: 'utf8', timeout: 120000, maxBuffer: 1048576,
                }).trim();
                assert.match(backup, /^backup ok:/);
              }
              client = await pool.connect();
              await client.query('BEGIN');
              await client.query("SET LOCAL lock_timeout = '5s'");
              await client.query("SET LOCAL statement_timeout = '15s'");
              await client.query('LOCK TABLE season_entries, season_pairings IN SHARE ROW EXCLUSIVE MODE');
              await client.query('LOCK TABLE saved_teams IN SHARE MODE');
              const snapshot = async () => ({
                entries: (await client.query('SELECT * FROM season_entries ORDER BY id')).rows,
                pairings: (await client.query('SELECT * FROM season_pairings ORDER BY id')).rows,
                rosters: (await client.query('SELECT id, user_id, roster, revision, updated_at FROM saved_teams ORDER BY id')).rows,
              });
              const before = await snapshot();
              const newEntry = before.entries.find(row => row.id === darkElfId);
              assert.ok(newEntry && newEntry.withdrawn_at === null, 'Dark Elf participant must remain active');
              assert.equal(newEntry.saved_team_id, '8547f9e2-5ad9-4b91-a0f0-56311a34bbcc');
              const team = (await client.query('SELECT user_id, name, base_team_slug FROM saved_teams WHERE id = $1', [entry.saved_team_id])).rows[0];
              assert.equal(team?.name, 'MeatGang');
              assert.equal(team?.user_id, entry.user_id);
              assert.equal(team?.base_team_slug, 'teams/snotling');
              const insert = async (table, row) => {
                assert.ok(['season_entries', 'season_pairings'].includes(table));
                const columns = (await client.query("SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = $1", [table])).rows.map(row => row.column_name);
                const keys = Object.keys(row);
                assert.ok(keys.every(key => /^[a-z_]+$/.test(key) && columns.includes(key)));
                return (await client.query(`INSERT INTO ${table} (${keys.join(', ')}) VALUES (${keys.map((_, index) => '$' + (index + 1)).join(', ')}) RETURNING id`, keys.map(key => row[key]))).rows[0].id;
              };
              const inserted = { entries: [], pairings: [] };
              const existingEntry = before.entries.find(row => row.id === entryId);
              if (existingEntry) {
                assert.ok(existingEntry.withdrawn_at, 'Recovered entry must be historical');
                for (const key of ['season_id', 'user_id', 'saved_team_id']) assert.equal(existingEntry[key], entry[key]);
              } else {
                inserted.entries.push(await insert('season_entries', { ...entry, withdrawn_at: new Date().toISOString() }));
              }
              const planned = [];
              for (const [index, source] of pairs.entries()) {
                const pair = { ...source };
                const round = (await client.query('SELECT season_id, round_number, status FROM season_rounds WHERE id = $1', [pair.round_id])).rows[0];
                assert.equal(round.season_id, seasonId);
                assert.equal(round.round_number, index + 1);
                assert.ok(['started', 'completed'].includes(round.status));
                assert.ok(before.entries.some(row => row.id === pair.home_entry_id && row.season_id === seasonId));
                const existing = before.pairings.find(row => row.id === pair.id);
                if (existing) {
                  for (const key of ['round_id', 'home_entry_id', 'away_entry_id', ...scoreKeys, 'home_points', 'away_points', 'result_type', 'result_status', 'match_kind']) {
                    assert.equal(existing[key], pair[key], `Existing result differs: ${pair.id} ${key}`);
                  }
                } else {
                  const sameRound = before.pairings.filter(row => row.round_id === pair.round_id);
                  assert.ok(!sameRound.some(row => [row.home_entry_id, row.away_entry_id].some(id => [pair.home_entry_id, pair.away_entry_id].includes(id))), 'Participant already has a pairing in this round');
                  if (sameRound.some(row => row.table_number === pair.table_number)) pair.table_number = Math.max(...sameRound.map(row => row.table_number), 0) + 1;
                  inserted.pairings.push(await insert('season_pairings', pair));
                }
                planned.push({ id: pair.id, round: index + 1, homeEntryId: pair.home_entry_id, awayEntryId: pair.away_entry_id,
                  td: [pair.home_touchdowns, pair.away_touchdowns], cas: [pair.home_casualties, pair.away_casualties], points: [pair.home_points, pair.away_points] });
              }
              const after = await snapshot();
              assert.deepEqual(after.entries.filter(row => !inserted.entries.includes(row.id)), before.entries);
              assert.deepEqual(after.pairings.filter(row => !inserted.pairings.includes(row.id)), before.pairings);
              assert.deepEqual(after.rosters, before.rosters);
              assert.equal(after.entries.filter(row => row.withdrawn_at === null).length, before.entries.filter(row => row.withdrawn_at === null).length);
              const result = { mode: APPLY ? 'applied' : 'dry-run', inserted, planned, backup,
                counts: { entries: after.entries.length, active: after.entries.filter(row => row.withdrawn_at === null).length, pairings: after.pairings.length },
                verification: { existingEntriesUnchanged: true, existingPairingsUnchanged: true, rosterHash: hash(after.rosters) },
                evidence: { sqlBackup: incident.source, round2: { xmin: 3081, xmax: 3105, copies: ['current', 'archive'], validatedRows: decoded.validated } },
              };
              await fs.writeFile(`${dir}/${APPLY ? 'restore-pending' : 'restore-plan'}.json`, JSON.stringify(result, null, 2), { mode: 0o600 });
              await client.query(APPLY ? 'COMMIT' : 'ROLLBACK');
              committed = APPLY;
              if (APPLY) await fs.rename(`${dir}/restore-pending.json`, `${dir}/restore-result.json`);
              console.log('RECOVERY_DATA ' + JSON.stringify(result));
            } catch (error) {
              if (client && !committed) await client.query('ROLLBACK').catch(() => {});
              console.log('RECOVERY_DATA ' + JSON.stringify({ error: error.message, committed }));
              throw error;
            } finally {
              client?.release();
              await pool.end();
            }
            
            NODE
