name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import fs from 'node:fs/promises';
            import crypto from 'node:crypto';
            import { execFileSync } from 'node:child_process';
            import { pool } from './server/db/pool.mjs';
            import { scoreLeagueResult } from './server/season/scoring.mjs';
            import { updateSeasonPairing } from './server/season/games.mjs';
            import { publicSeasonPairing } from './server/api/serializers.mjs';
            
            const APPLY = false;
            const dir = '/var/backups/bloodbowl-league/snotling-history-tuples-20261023';
            const entryId = '0d2df1fb-53ba-4e05-a1a8-cdb054f8e4d2';
            const seasonId = '3b147bf3-31b5-4ebb-8fb3-76d66d5dbfa3';
            const round1Id = 'db1117f0-2a10-45e5-85f9-d268002569d2';
            const round2Id = '618aa388-0a10-4a97-9f13-f9e06bd881e4';
            const targets = [
              { id: '65b628bd-031f-4979-957f-f17aff3cc3e7', round: 3,
                roundId: '4fc25927-68e6-4707-9800-501d23abcc12',
                opponentId: 'b647faac-b4b5-48c4-9183-c90e03de553e', opponent: 'Приморец' },
              { id: '53a7d8d4-6b5f-4764-80e5-65ba262b4ea0', round: 4,
                roundId: 'c6284b95-4096-4ff5-8652-f254f10fdc6c',
                opponentId: 'c8d9cdde-d3df-4a35-ac07-6c6e0958ff9a', opponent: 'Seven Inches of Glory' },
            ];
            const evidence = {
              source: 'User confirmation in Codex chat, 2026-10-23',
              statement: 'Все проиграл 1-0, победил только Spartak Arabkir 1-0. Каз не знаю, да и не важно.',
              round1: 'Correct the archived 2-0 to the user-confirmed 1-0; retain recovered CAS 2-1.',
              rounds3and4: 'Reconstructed fixture IDs and home/away orientation. TD confirmed by user; CAS 0-0 is an unknown-data placeholder, not recovered statistics. No CAS bonus awarded.',
              dates: 'New fixture timestamps record restoration, not the unknown dates of play.',
            };
            const hash = value => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
            let client;
            let committed = false;
            try {
              const previous = JSON.parse(await fs.readFile(`${dir}/restore-result.json`, 'utf8'));
              assert.equal(previous.mode, 'applied');
              assert.ok(previous.inserted.pairings.includes(round1Id) && previous.inserted.pairings.includes(round2Id));
              let backup = null;
              if (APPLY) {
                backup = execFileSync('node', ['scripts/backup-db.mjs', '--label', 'before-snotling-completion'], {
                  env: { ...process.env, BACKUP_DIR: `${dir}/before-completion` }, encoding: 'utf8', timeout: 120000, maxBuffer: 1048576,
                }).trim();
                assert.match(backup, /^backup ok:/);
              }
              client = await pool.connect();
              await client.query('BEGIN');
              await client.query("SET LOCAL lock_timeout = '5s'");
              await client.query("SET LOCAL statement_timeout = '15s'");
              await client.query('LOCK TABLE season_entries, season_pairings IN SHARE ROW EXCLUSIVE MODE');
              await client.query('LOCK TABLE saved_teams IN SHARE MODE');
              const snapshot = async () => ({
                entries: (await client.query('SELECT * FROM season_entries ORDER BY id')).rows,
                pairings: (await client.query('SELECT * FROM season_pairings ORDER BY id')).rows,
                rosters: (await client.query('SELECT id, user_id, roster, revision, updated_at FROM saved_teams ORDER BY id')).rows,
              });
              const before = await snapshot();
              const entry = before.entries.find(row => row.id === entryId);
              assert.equal(entry?.season_id, seasonId);
              assert.equal(entry?.saved_team_id, '239e7fe0-8799-4fda-b5d1-3ed9d2be5871');
              assert.ok(entry.withdrawn_at, 'MeatGang must remain historical');
              const replacement = before.entries.find(row => row.id === 'e26605d5-4da2-4c47-b05d-a9520448bbea');
              assert.ok(replacement && replacement.withdrawn_at === null, 'Dark Elf replacement must remain active');
              const first = before.pairings.find(row => row.id === round1Id);
              assert.equal(first?.away_entry_id, entryId);
              assert.equal(first?.home_entry_id, 'cbb8b652-637d-47ce-a267-7c9bfb2e3a82');
              assert.ok([1, 2].includes(first.home_touchdowns));
              assert.deepEqual([first.away_touchdowns, first.home_casualties, first.away_casualties, first.home_points, first.away_points], [0, 2, 1, 4, 0]);
              assert.equal(first.result_status, 'confirmed');
              const second = before.pairings.find(row => row.id === round2Id);
              assert.deepEqual([second?.home_touchdowns, second?.away_touchdowns, second?.home_casualties, second?.away_casualties], [0, 1, 3, 2]);
              const updated = [];
              if (first.home_touchdowns !== 1) {
                await updateSeasonPairing(seasonId, round1Id, { homeTouchdowns: 1 }, true, '', client);
                updated.push(round1Id);
              }
              const inserted = [];
              const planned = [];
              for (const target of targets) {
                const round = (await client.query('SELECT * FROM season_rounds WHERE id = $1', [target.roundId])).rows[0];
                assert.equal(round?.season_id, seasonId);
                assert.equal(round?.round_number, target.round);
                assert.equal(round?.status, 'completed');
                const opponent = (await client.query('SELECT e.season_id, t.name FROM season_entries e JOIN saved_teams t ON t.id = e.saved_team_id WHERE e.id = $1', [target.opponentId])).rows[0];
                assert.equal(opponent?.season_id, seasonId);
                assert.equal(opponent?.name, target.opponent);
                const points = scoreLeagueResult({ homeTouchdowns: 1, awayTouchdowns: 0, homeCasualties: 0, awayCasualties: 0 });
                assert.deepEqual([points.homePoints, points.awayPoints], [4, 0]);
                let existing = before.pairings.find(row => row.id === target.id);
                if (existing) {
                  for (const [key, value] of Object.entries({ round_id: target.roundId, home_entry_id: target.opponentId, away_entry_id: entryId,
                    home_touchdowns: 1, away_touchdowns: 0, home_casualties: 0, away_casualties: 0, home_points: 4, away_points: 0,
                    result_type: 'played', result_status: 'confirmed', match_kind: 'league' })) assert.equal(existing[key], value);
                } else {
                  const other = before.pairings.filter(row => row.round_id === target.roundId);
                  assert.ok(!other.some(row => [row.home_entry_id, row.away_entry_id].some(id => [entryId, target.opponentId].includes(id))), 'Participant already paired in target round');
                  let table = 1;
                  while (other.some(row => row.table_number === table)) table++;
                  existing = (await client.query(`INSERT INTO season_pairings
                    (id, round_id, table_number, home_entry_id, away_entry_id, home_touchdowns, away_touchdowns,
                     home_casualties, away_casualties, home_points, away_points, result_type, result_status,
                     match_kind, preparation_status, confirmed_at)
                    VALUES ($1, $2, $3, $4, $5, 1, 0, 0, 0, $6, $7, 'played', 'confirmed', 'league', 'not_started', now()) RETURNING *`,
                  [target.id, target.roundId, table, target.opponentId, entryId, points.homePoints, points.awayPoints])).rows[0];
                  inserted.push(target.id);
                }
                assert.equal(publicSeasonPairing({ ...existing, round_number: target.round, round_status: 'completed' }).resultStatus, 'confirmed');
                planned.push({ ...target, td: [1, 0], casPlaceholder: [0, 0], points: [4, 0], table: existing.table_number });
              }
              const after = await snapshot();
              assert.deepEqual(after.entries, before.entries);
              assert.deepEqual(after.rosters, before.rosters);
              assert.deepEqual(after.pairings.filter(row => !inserted.includes(row.id) && row.id !== round1Id), before.pairings.filter(row => row.id !== round1Id));
              const corrected = after.pairings.find(row => row.id === round1Id);
              assert.equal(corrected.home_touchdowns, 1);
              const untouchedFirst = row => Object.fromEntries(Object.entries(row).filter(([key]) => !['home_touchdowns', 'confirmed_at', 'updated_at'].includes(key)));
              assert.deepEqual(untouchedFirst(corrected), untouchedFirst(first));
              const games = after.pairings.filter(row => [row.home_entry_id, row.away_entry_id].includes(entryId));
              assert.equal(games.length, 4);
              assert.equal(games.filter(row => row.away_touchdowns > row.home_touchdowns).length, 1);
              assert.equal(games.reduce((total, row) => total + row.away_points, 0), 4);
              const result = { mode: APPLY ? 'applied' : 'dry-run', inserted, updated, planned, backup, evidence,
                counts: { pairings: after.pairings.length, MeatGangGames: games.length, MeatGangPoints: 4 },
                verification: { entriesUnchanged: true, otherPairingsUnchanged: true, rosterHash: hash(after.rosters) },
                round1Before: first, round1After: corrected };
              await fs.writeFile(`${dir}/${APPLY ? 'completion-pending' : 'completion-plan'}.json`, JSON.stringify(result, null, 2), { mode: 0o600 });
              await client.query(APPLY ? 'COMMIT' : 'ROLLBACK');
              committed = APPLY;
              if (APPLY) await fs.rename(`${dir}/completion-pending.json`, `${dir}/completion-result.json`);
              console.log('RECOVERY_DATA ' + JSON.stringify(result));
            } catch (error) {
              if (client && !committed) await client.query('ROLLBACK').catch(() => {});
              console.log('RECOVERY_DATA ' + JSON.stringify({ error: error.message, committed }));
              throw error;
            } finally {
              client?.release();
              await pool.end();
            }
            
            NODE
