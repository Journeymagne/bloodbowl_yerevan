name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            # Schema first: the server refuses to start against a database that
            # is behind the code, rather than running half-working. Migrations
            # are idempotent and recorded, so this is a no-op when nothing is
            # outstanding.
            npm run db:migrate
            pm2 restart bloodbowl-league
