name: Inspect season history

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved results and backups
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bloodbowl-league
            node --input-type=module <<'NODE'
            import fs from 'node:fs/promises';
            import { execFileSync } from 'node:child_process';
            import { pool } from './server/db/pool.mjs';
            try {
              const teams=(await pool.query(`SELECT t.id,t.user_id,u.login,t.name,t.base_team_slug,t.created_at
                FROM saved_teams t JOIN users u ON u.id=t.user_id WHERE t.base_team_slug ILIKE '%snot%' OR t.base_team_slug ILIKE '%dark-elf%' ORDER BY t.created_at`)).rows;
              const entries=(await pool.query(`SELECT e.id,e.season_id,e.user_id,u.login,e.saved_team_id,t.name,t.base_team_slug,e.withdrawn_at,
                (SELECT count(*)::int FROM season_pairings p WHERE p.home_entry_id=e.id OR p.away_entry_id=e.id) AS matches
                FROM season_entries e JOIN users u ON u.id=e.user_id JOIN saved_teams t ON t.id=e.saved_team_id ORDER BY e.created_at`)).rows;
              const users=(await pool.query('SELECT id,login,created_at FROM users ORDER BY created_at')).rows;
              const rounds=(await pool.query('SELECT id,season_id,round_number,status FROM season_rounds ORDER BY round_number')).rows;
              const storage=(await pool.query(`SELECT c.relname,pg_relation_filepath(c.oid) AS file,pg_relation_size(c.oid)::int AS bytes,
                s.n_live_tup,s.n_dead_tup,s.last_vacuum,s.last_autovacuum FROM pg_class c JOIN pg_stat_user_tables s ON s.relid=c.oid
                WHERE c.relname IN ('season_entries','season_pairings')`)).rows;
              const backups=execFileSync('find',['/var/backups/bloodbowl-league','-maxdepth','3','-type','f','-printf','%p %s bytes\n'],{encoding:'utf8',timeout:30000}).trim().split('\n');
              console.log('RECOVERY_DATA '+JSON.stringify({teams,entries,users,rounds,storage,backups}));
            } finally {await pool.end();}
            
            NODE
