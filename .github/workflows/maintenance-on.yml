name: Maintenance on

# Closes the site with the maintenance page (DEPLOYMENT.md, "Maintenance Mode").
# The site does not reopen by itself when the end comes: that time only drives
# the page's countdown. "Maintenance off" reopens it.

on:
  workflow_dispatch:
    inputs:
      until:
        description: "Срок: 90 или 90m (минуты), 2h, 1h30m, 19:00 (по Еревану, сегодня или завтра) или 2026-11-02T19:00+04:00. Пусто — без срока. Сайт сам не откроется: выключать через Maintenance off."
        required: false
        default: ""
      kind:
        description: "planned — плановые работы, unplanned — сбой (срок на странице не показывается)"
        type: choice
        options: [planned, unplanned]
        default: planned

# On and off never run at once: the later one waits, so the flag ends as the last one asked.
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      # Read on the runner, so a slip ends here and the site is not touched. The
      # server's command checks the time again and refuses one already past.
      - name: Work out the end
        id: ends
        env:
          UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          UNTIL=$(printf '%s' "$UNTIL" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | tr '[:upper:]' '[:lower:]')
          if [ -z "$UNTIL" ]; then
            ENDS=""
          elif [[ "$UNTIL" =~ ^([0-9]+)(m|min)?$ ]]; then
            ENDS=$(date -u -d "+${BASH_REMATCH[1]} minutes" +%Y-%m-%dT%H:%M:%SZ)
          elif [[ "$UNTIL" =~ ^([0-9]+)h(([0-9]+)(m|min)?)?$ ]]; then
            ENDS=$(date -u -d "+${BASH_REMATCH[1]} hours +${BASH_REMATCH[3]:-0} minutes" +%Y-%m-%dT%H:%M:%SZ)
          elif [[ "$UNTIL" =~ ^([01]?[0-9]|2[0-3]):[0-5][0-9]$ ]]; then
            # The league's clock. A time already past today is tomorrow's.
            ENDS=$(TZ=Asia/Yerevan date -d "today $UNTIL" +%Y-%m-%dT%H:%M%:z)
            if [ "$(date -d "$ENDS" +%s)" -le "$(date +%s)" ]; then
              ENDS=$(TZ=Asia/Yerevan date -d "tomorrow $UNTIL" +%Y-%m-%dT%H:%M%:z)
            fi
          elif [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}[t\ ][0-9]{2}:[0-9]{2}(:[0-9]{2})?(z|[+-][0-9]{2}:?[0-9]{2})$ ]]; then
            ENDS=$(printf '%s' "$UNTIL" | tr 'tz ' 'TZT')
          else
            echo "::error::Не понял срок «$UNTIL»: нужно 90, 90m, 2h, 1h30m, 19:00 или 2026-11-02T19:00+04:00"
            exit 1
          fi
          echo "ends=$ENDS" >> "$GITHUB_OUTPUT"
          if [ -n "$ENDS" ]; then
            echo "Ends: $ENDS ($(TZ=Asia/Yerevan date -d "$ENDS" '+%d.%m %H:%M') in Yerevan)"
          else
            echo "Ends: not set"
          fi

      - name: Turn maintenance on
        uses: appleboy/ssh-action@v1
        env:
          KIND: ${{ inputs.kind }}
          ENDS: ${{ steps.ends.outputs.ends }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: KIND,ENDS
          script: |
            set -e
            cd /opt/bloodbowl-league
            if [ -n "$ENDS" ]; then
              npm run maintenance:on -- --kind "$KIND" --ends "$ENDS"
            else
              npm run maintenance:on -- --kind "$KIND"
            fi

            # The server notices the flag within two seconds; its health check
            # says so, and still answers 200 while the site is closed.
            PORT=$(grep -hE '^(APP_PORT|PORT)=' /etc/bloodbowl-league/.env 2>/dev/null | tail -1 | cut -d= -f2)
            PORT=${PORT:-3002}
            for attempt in $(seq 1 10); do
              HEALTH=$(curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/api/health" || true)
              case "$HEALTH" in
                *'"maintenance":{'*) echo "the site is closed: ${HEALTH}"; exit 0 ;;
              esac
              sleep 1
            done
            echo "the flag is written, but the server does not report maintenance: ${HEALTH:-no answer} - look at pm2 logs bloodbowl-league"
            exit 1
