<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>ResultSheet — preview</title></head>
<body>
<div class="g-demo">
  <h3 class="g-h3" style="text-align:center">Результат матча</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center" class="g-overline"><span>Мы</span><span>Silverbrook Rangers</span></div>
  <span style="font-size:14px;font-weight:600">Тачдауны</span>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><span class="g-score-step"><button class="g-score-step__btn">−</button><span class="g-score-step__v">2</span><button class="g-score-step__btn">+</button></span><span class="g-score-step"><button class="g-score-step__btn">−</button><span class="g-score-step__v">1</span><button class="g-score-step__btn">+</button></span></div>
  <span style="text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700">Победа 2:1</span>
  <button class="g-btn g-btn--primary" style="width:100%">Отправить результат</button>
</div>
</body>
</html>
