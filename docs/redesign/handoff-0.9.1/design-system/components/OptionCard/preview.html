<!-- @dsCard group="Actions" height=300 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>OptionCard — preview</title></head>
<body>
<div class="g-demo">
  <button class="g-option"><span style="display:flex;flex-direction:column;gap:2px"><span class="g-option__title">Случайный основной навык</span><span class="g-option__sub">Agility, General · +20k</span></span><span class="g-option__pill">4 SPP</span></button>
  <button class="g-option" aria-pressed="true"><span style="display:flex;flex-direction:column;gap:2px"><span class="g-option__title">Основной навык на выбор</span><span class="g-option__sub">Agility, General · +20k</span></span><span class="g-option__pill">8 SPP</span></button>
  <button class="g-option" disabled><span style="display:flex;flex-direction:column;gap:2px"><span class="g-option__title">Улучшение характеристики</span><span class="g-option__sub">Не хватает 2 SPP</span></span><span class="g-option__pill">16 SPP</span></button>
  <button class="g-option" aria-pressed="true" style="justify-content:flex-start"><span class="g-radio"></span><span style="display:flex;flex-direction:column;gap:2px"><span class="g-option__title">Серьёзная травма</span><span class="g-option__sub">Casualty 9–10 · только пропуск матча</span></span></button>
</div>
</body>
</html>
