<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>BottomSheet — preview</title></head>
<body>
<div style="position:relative;height:500px;max-width:390px;overflow:hidden;background:var(--surface)">
  <div class="g-scrim">
    <div class="g-sheet" role="dialog" aria-label="Прокачка">
      <div class="g-sheet__handle"></div>
      <div class="g-sheet__head">
        <button class="g-icon-btn" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <div><div class="g-sheet__title">Категория навыка</div><div class="g-sheet__sub">Основной навык на выбор · 8 SPP</div></div>
        <button class="g-icon-btn" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div class="g-steps"><i class="on"></i><i class="now"></i><i></i></div>
      <div class="g-sheet__body">
        <button class="g-option" aria-pressed="true"><span class="g-option__title">Agility</span><span class="g-option__sub">доступно 12 из 14</span></button>
        <button class="g-option"><span class="g-option__title">General</span><span class="g-option__sub">доступно 15 из 16</span></button>
      </div>
      <div class="g-sheet__foot"><button class="g-btn g-btn--primary">Далее</button></div>
    </div>
  </div>
</div>
</body>
</html>
