<!-- @dsCard group="Match" height=470 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>MatchCard — preview</title></head>
<body>
<div class="g-demo">
  <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="g-h2">Текущий матч</h2><span class="g-status g-status--live">Идёт игра</span></div>
  <div class="g-match g-match--live">
    <div class="g-match__meta"><b>Тур 7 · дома</b><span>[ДАТА И ВРЕМЯ]</span></div>
    <div class="g-match__teams"><span class="g-match__name">Ashgrove Wardens</span><span class="g-match__vs">vs</span><a class="g-match__name" href="#" style="color:inherit;text-decoration:none">Silverbrook Rangers</a></div>
    <div class="g-match__tiles"><div class="g-tile"><div class="g-tile__label">TV</div><div class="g-tile__value">1 120k <span style="font-weight:500;color:var(--muted)">/ 1 210k</span></div></div><button class="g-tile g-tile--gets"><div class="g-tile__label">Индьюсменты · получаем мы</div><div class="g-tile__value">+90k</div></button></div>
    <a class="g-link-card" href="#"><span style="flex:1"><b style="font-size:16px">Состав для игры</b><br><span style="font-size:13px">отмечайте TD, CAS и MVP по ходу матча</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></a>
    <button class="g-btn g-btn--dark" style="width:100%"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>Завершить матч</button>
    <button class="g-btn" style="align-self:center;background:transparent;color:var(--muted)">Отменить начало</button>
  </div>
</div>
</body>
</html>
