n Factor на 1, а сам игрок получает +1 SPP."], ["11", "Эффектный приём", "Любой игрок вашей команды, успешно поймавший мяч (Catch) в результате действия Pass, получает 1 SPP."], ["12", "Взаимодействие с фанатами", "Каждый раз, когда игрок соперника получает травму (Casualty) в результате того, что его вытолкнули в толпу (Pushed into the Crowd), повышайте свой Fan Factor на 1 в этом матче, а соответствующий игрок получает дополнительно 1 SPP."], ["13", "Неистовство фолов", "Раз за дран ваша команда может выполнить дополнительное действие Foul. Каждый раз, когда игрок соперника получает травму (Casualty) в результате Foul, соответствующий игрок получает дополнительно 1 SPP."], ["14", "Бросок камня", "Раз за игру, в начале любого вашего хода, до активации каких-либо игроков, вы можете случайно выбрать одного игрока соперника на поле и бросить D6. На 4+ разгневанный фанат бросает камень, и выбранный игрок немедленно получает Knocked Down."], ["15", "Под прицелом", "Любой игрок соперника, выполняющий действие Foul, автоматически удаляется с поля (Sent-off), если он пробивает броню, независимо от того, выпал ли натуральный дубль."], ["16", "Интенсивная тренировка", "Случайно выберите одного игрока вашей команды, участвующего в этом матче. Выбранный игрок получает один навык категории Primary по своему выбору на время этого матча."]], "cols": "56px 190px minmax(0, 1fr)", "notes": ["Тексты — из регламента Gata League (content/Gata-ru)."]},
