    ctaLabel: reg ? 'Создать аккаунт' : 'Войти', ctaBg: (reg || ready) ? AUTH_ACC : '#A9B3AE', ctaDisabled: reg ? false : !ready,
    submit: function () {
      if (reg && !ready) { self.setState({ touched: true }); return; }
      if (!ready) return;
      if (!reg && st.pass !== 'demo-pass') { self.setState({ err: 'Неверный логин или пароль', touched: true }); return; }
      self.setState({ err: '', done: true });
    },
    done: !!st.done, notDone: !st.done,
    doneTitle: reg ? 'Аккаунт создан' : 'Вы вошли',
    doneText: reg ? 'Следующий шаг — создать команду и заявить её в сезон.' : 'Открываем обзор команды…',
    switchText: reg ? 'Уже есть аккаунт?' : 'Нет аккаунта?', switchLink: reg ? 'Войти' : 'Зарегистрироваться',
    switchMode: function () { self.setState({ mode: reg ? 'login' : 'register', err: '', touched: false, forgot: false }); }
  };
}
// ---- /auth ----

class Component extends DCLogic {
  constructor(props) { super(props); this.state = authState(props); }
  componentDidUpdate(prev) { if (prev && (prev.mode !== this.props.mode || prev.demoError !== this.props.demoError)) this.setState(authState(this.props)); }
  renderVals() { var v = authVals(this); v.deskTitle = this.state.mode === 'register' ? 'Регистрация тренера' : 'Вход в аккаунт'; return v; }
}

return Component;
} });
DC.mount("DeskLoginRegister", document.getElementById('app'));
</script>
</body>
