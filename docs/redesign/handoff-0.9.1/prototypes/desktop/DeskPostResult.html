display: flex; flex-direction: column; gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #DCE3DF\"><span style=\"width: max-content; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #E4F0E9; color: #163A28; font-size: 12px; font-weight: 700; white-space: nowrap\"><span style=\"width: 7px; height: 7px; border-radius: 4px; background: #2F7A52\"><\/span>Соперник подтвердил счёт 2–1<\/span><a href=\"DeskPostPlayers.html\" style=\"height: 48px; border-radius: 12px; background: #2F7A52; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center\">Далее: доход и фанаты<\/a><\/div><\/aside>\n  <\/main>\n<\/div>\n", defaults: {"review": true}, factory: function () {

var CFG = {"steps": {"tdUs": {"v": 2, "min": 0, "max": 9}, "tdOpp": {"v": 1, "min": 0, "max": 9}, "casUs": {"v": 3, "min": 0, "max": 9}, "casOpp": {"v": 1, "min": 0, "max": 9}}, "groups": {"mode": {"opts": [{"v": "played", "l": "Сыграно"}, {"v": "technical", "l": "Техническое"}, {"v": "conceded", "l": "Сдача"}, {"v": "safe", "l": "Сдача без штрафа"}], "val": "played"}}};
function extraVals(self, v, st) {
