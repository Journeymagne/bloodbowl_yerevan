<script>/* dc-lite — a tiny standalone renderer for Gata League prototype artboards.
   Supports {{path}} lookups, <sc-if>, <sc-for>, <dc-import>, DCLogic setState. */
(function () {
  var DEFS = {};
  var parser = new DOMParser();

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (upd) {
    var s = typeof upd === 'function' ? upd(this.state, this.props) : upd;
    if (s == null) return;
    this.state = Object.assign({}, this.state, s);
    schedule();
  };
  window.DCLogic = DCLogic;

  function define(name, def) {
    var doc = parser.parseFromString('<!doctype html><html><body>' + def.tpl + '</body></html>', 'text/html');
    def.root = doc.body;
    DEFS[name] = def;
  }

  function camel(s) { return s.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); }); }

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return parseFloat(path);
    if (/^'.*'$|^".*"$/.test(path)) return path.slice(1, -1);
    var parts = path.split('.');
    var head = parts[0], v, found = false;
    for (var sc = scope; sc; sc = sc.__parent) {
      if (Object.prototype.hasOwnProperty.call(sc, head)) { v = sc[head]; found = true; break; }
    }
    if (!found) return undefined;
    for (var i = 1; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var PURE = /^\s*\{\{([^}]*)\}\}\s*$/;
  function interp(str, scope) {
    return str.replace(/\{\{([^}]*)\}\}/g, function (_, e) { var v = lookup(e, scope); return v == null ? '' : String(v); });
  }
  function child(scope, vars) { var o = Object.assign({}, vars); o.__parent = scope; return o; }

  var instances = {};
  function instantiate(name, props, key) {
    var def = DEFS[name];
    if (!def) return null;
    var inst = instances[key];
    if (!inst || inst.__name !== name) {
      var full = Object.assign({}, def.defaults, props);
      var Cls = def.factory();
      inst = new Cls(full);
      inst.__name = name;
      instances[key] = inst;
    }
    return inst;
  }

  function renderComponent(name, props, key) {
    var inst = instantiate(name, props, key);
    if (!inst) { var d = document.createElement('div'); d.textContent = 'Missing component ' + name; return [d]; }
    var vals = inst.renderVals ? inst.renderVals() : {};
    var scope = Object.assign({}, vals); scope.__parent = null;
    var out = [];
    var ctr = { n: 0 };
    DEFS[name].root.childNodes.forEach(function (n) { out = out.concat(renderNode(n, scope, key, ctr)); });
    return out;
  }

  function renderNode(node, scope, key, ctr) {
    if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, scope))];
    if (node.nodeType !== 1) return [];
    var tag = node.localName;
    var out = [];
    if (tag === 'sc-if') {
      if (!lookup((node.getAttribute('value') || '').replace(/^\s*\{\{|\}\}\s*$/g, ''), scope)) return [];
      node.childNodes.forEach(function (c) { out = out.concat(renderNode(c, scope, key, ctr)); });
      return out;
    }
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\s*\{\{|\}\}\s*$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var v = {}; v[as] = item; v[as + 'Index'] = i;
        var s = child(scope, v);
        node.childNodes.forEach(function (c) { out = out.concat(renderNode(c, s, key, ctr)); });
      });
      return out;
    }
    if (tag === 'dc-import') {
      var props = {};
      Array.prototype.forEach.call(node.attributes, function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        var m = a.value.match(PURE);
        props[camel(a.name)] = m ? lookup(m[1], scope) : a.value;
      });
      var wrap = document.createElement('div');
      wrap.style.display = 'contents';
      renderComponent(node.getAttribute('name'), props, key + '/' + node.getAttribute('name') + (ctr.n++)).forEach(function (n) { wrap.appendChild(n); });
      return [wrap];
    }
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
    var deferred = [];
    Array.prototype.forEach.call(node.attributes, function (a) {
      var name = a.name, val = a.value, m = val.match(PURE);
      if (name.indexOf('on') === 0 && m) {
        var fn = lookup(m[1], scope);
        if (typeof fn === 'function') {
          var ev = name.slice(2).toLowerCase();
          var isText = tag === 'input' && !/^(checkbox|radio)$/i.test(node.getAttribute('type') || '') || tag === 'textarea';
          if (ev === 'change' && isText) ev = 'input';
          el.addEventListener(ev, function (e) { fn(e); });
        }
        return;
      }
      if (name === 'data-optlist') { deferred.push(['options', lookup(val, scope)]); return; }
      if (m) {
        var v = lookup(m[1], scope);
        if (name === 'value') { deferred.push(['value', v]); return; }
        if (name === 'checked') { deferred.push(['checked', !!v]); return; }
        if (v === false || v == null) return;
        if (name === 'disabled' || name === 'selected') { if (v) el.setAttribute(name, ''); return; }
        if (name === 'href' && typeof v === 'string') v = v.replace(/^([A-Za-z0-9]+)\.dc\.html/, '$1.html');
        el.setAttribute(name, v === true ? '' : String(v));
        return;
      }
      if (name === 'value' && (tag === 'select' || tag === 'input')) { deferred.push(['value', interp(val, scope)]); return; }
      el.setAttribute(name, interp(val, scope));
    });
    node.childNodes.forEach(function (c) { renderNode(c, scope, key, ctr).forEach(function (n) { el.appendChild(n); }); });
    deferred.forEach(function (d) {
      if (d[0] === 'options') (d[1] || []).forEach(function (o) { var op = document.createElement('option'); op.value = o.v; op.textContent = o.v; el.appendChild(op); });
    });
    deferred.forEach(function (d) {
      if (d[0] === 'value') { el.value = d[1] == null ? '' : d[1]; if (tag === 'input') el.setAttribute('value', el.value); }
      if (d[0] === 'checked') el.checked = d[1];
    });
    return [el];
  }

  /* --- mount & re-render, keeping scroll positions and focus --- */
  var host, rootName, pending = false;
  function pathOf(el) { var p = []; while (el && el !== host) { var i = 0, s = el; while ((s = s.previousElementSibling)) i++; p.unshift(i); el = el.parentElement; } return p.join('.'); }
  function byPath(p) { var el = host; if (!p) return null; p.split('.').forEach(function (i) { el = el && el.children[+i]; }); return el; }
  function render() {
    pending = false;
    var scrolls = [];
    if (host.firstChild) host.querySelectorAll('*').forEach(function (el) { if (el.scrollTop || el.scrollLeft) scrolls.push([pathOf(el), el.scrollTop, el.scrollLeft]); });
    var act = document.activeElement, focus = null;
    if (act && host.contains(act)) focus = [pathOf(act), act.selectionStart, act.selectionEnd];
    var nodes = renderComponent(rootName, {}, 'root');
    host.innerHTML = '';
    nodes.forEach(function (n) { host.appendChild(n); });
    scrolls.forEach(function (s) { var el = byPath(s[0]); if (el) { el.scrollTop = s[1]; el.scrollLeft = s[2]; } });
    if (focus) { var f = byPath(focus[0]); if (f && f.focus) { f.focus(); try { if (focus[1] != null) f.setSelectionRange(focus[1], focus[2]); } catch (e) {} } }
  }
  function schedule() { if (!pending) { pending = true; (window.queueMicrotask || setTimeout)(render); } }
  window.DC = { define: define, mount: function (name, el) { rootName = name; host = el; render(); } };
})();
</script>
<script>
DC.define("RefAdvancement", { tpl: "\n<div style=\"width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #14201A; font-family: 'Golos Text', system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden\">\n\n  <header style=\"background: #17392C; color: #FFFFFF; padding: {{hdrPadTop}} 16px 0; display: flex; flex-direction: column; gap: 2px; flex: none; transition: padding .15s\">\n    <a href=\"TeamSwitch.html\" aria-label=\"Сменить команду\" style=\"align-self: stretch; display: flex; align-items: center; gap: 10px; padding: 2px 0; border: 0; background: transparent; color: #FFFFFF; text-decoration: none; text-align: left; font-family: inherit; cursor: pointer; min-width: 0\">\n      <svg width=\"{{hdrCrestW}}\" height=\"{{hdrCrestH}}\" viewBox=\"0 0 44 50\" aria-hidden=\"true\" style=\"flex: none; transition: width .15s, height .15s\">\n        <path d=\"M22 2 L40 8 V24 C40 36 32 44 22 48 C12 44 4 36 4 24 V8 Z\" fill=\"#F2C14E\" stroke=\"#FFFFFF\" stroke-width=\"2\"><\/path>\n        <path d=\"M22 9 L34 13 V24 C34 32 29 38 22 41 C15 38 10 32 10 24 V13 Z\" fill=\"#17392C\"><\/path>\n        <ellipse cx=\"22\" cy=\"25\" rx=\"8\" ry=\"5.2\" fill=\"none\" stroke=\"#F2C14E\" stroke-width=\"2\" transform=\"rotate(-30 22 25)\"><\/ellipse>\n        <path d=\"M18.5 25.5 L25.5 24.5 M19.5 23.5 L20.3 26.3 M22 23 L22.8 25.8 M24.3 22.6 L25.1 25.4\" stroke=\"#F2C14E\" stroke-width=\"1.4\" stroke-linecap=\"round\" transform=\"rotate(-30 22 25)\"><\/path>\n      <\/svg>\n      <span style=\"display: flex; flex-direction: column; gap: 1px; min-width: 0\"><span style=\"display: flex; align-items: center; gap: 4px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: {{hdrNameSize}}; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">Ashgrove Wardens<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; color: #A9C4B6\"><path d=\"M8 10l4 4 4-4\"><\/path><\/svg><\/span><sc-if value=\"{{hdrFull}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; color: #CFE0D7; white-space: nowrap\">Люди · 2-е место в лиге<\/span><\/sc-if><\/span>\n    <\/a>\n    <nav aria-label=\"Разделы\" style=\"display: flex; gap: 18px; overflow-x: auto; padding: 0 2px; font-size: 15px; font-weight: 600; scrollbar-width: none; -webkit-mask-image: linear-gradient(to left, #000 85%, transparent); mask-image: linear-gradient(to left, #000 85%, transparent); direction: rtl\">\n      <a href=\"Settings.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Настройки<\/a>\n      <a href=\"Ref.html\" aria-current=\"page\" style=\"color: #FFFFFF; text-decoration: none; padding: 10px 0 9px; white-space: nowrap; border-bottom: 3px solid #FFFFFF; direction: ltr\">Справочник<\/a>\n      <a href=\"League.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Таблица<\/a>\n      <a href=\"Matches.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Матчи<\/a>\n      <a href=\"Stats.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Состав<\/a>\n      <a href=\"TeamManage.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Команда<\/a>\n      <a href=\"Team.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Обзор<\/a>\n    <\/nav>\n  <\/header>\n\n  <main onScroll=\"{{onMainScroll}}\" style=\"flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 22px\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <a href=\"Ref.html\" style=\"align-self: flex-start; min-height: 32px; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #2F7A52; text-decoration: none\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"><\/path><\/svg>Справочник\n      <\/a>\n      <h1 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; line-height: 1\">Player Advancement<\/h1>\n      <p style=\"margin: 0; font-size: 15px; line-height: 1.45; color: #3E4A44\">Игроки зарабатывают SPP и тратят их на повышения. Цена растёт с каждым следующим повышением.<\/p>\n    <\/div>\n\n    <section style=\"display: flex; flex-direction: column; gap: 8px\">\n      <h2 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700\">Стоимость в SPP<\/h2>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 50px); align-items: end; padding: 0 0 8px; border-bottom: 1px solid #DCE3DF; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #5F6B65; text-transform: uppercase\">\n        <span>Повышение<\/span><span style=\"text-align: center\">Rand.<\/span><span style=\"text-align: center\">Prim.<\/span><span style=\"text-align: center\">Sec.<\/span><span style=\"text-align: center\">Стат<\/span>\n      <\/div>\n      <sc-for list=\"{{costRows}}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 50px); align-items: center; min-height: 48px; border-bottom: 1px solid #E6EBE8\">\n          <span style=\"display: flex; flex-direction: column; line-height: 1.2\"><span style=\"font-size: 15px; font-weight: 600\">{{r.name}}<\/span><span style=\"font-size: 12px; color: #5F6B65\">{{r.n}}-е повышение<\/span><\/span>\n          <span style=\"text-align: center; font-size: 16px\">{{r.random}}<\/span>\n          <span style=\"text-align: center; font-size: 16px\">{{r.primary}}<\/span>\n          <span style=\"text-align: center; font-size: 16px\">{{r.secondary}}<\/span>\n          <span style=\"text-align: center; font-size: 16px\">{{r.stat}}<\/span>\n        <\/div>\n      <\/sc-for>\n      <div style=\"font-size: 12px; color: #5F6B65\">Rand. — случайный основной навык. Prim. / Sec. — основной или вторичный навык на выбор.<\/div>\n    <\/section>\n\n    <section style=\"display: flex; flex-direction: column\">\n      <h2 style=\"margin: 0 0 6px; font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700\">Рост стоимости игрока<\/h2>\n      <sc-for list=\"{{tvRows}}\" as=\"t\" hint-placeholder-count=\"7\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px solid #E6EBE8; font-size: 15px\"><span>{{t.k}}<\/span><span style=\"font-weight: 700\">{{t.v}}<\/span><\/div>\n      <\/sc-for>\n    <\/section>\n\n    <section style=\"display: flex; flex-direction: column; gap: 8px\">\n      <h2 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700\">Элитные комбинации<\/h2>\n      <p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #3E4A44\">Если комбинация собрана через повышения, стоимость игрока растёт ещё на 15k.<\/p>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n        <span style=\"padding: 8px 12px; border-radius: 10px; background: #F3F6F4; font-size: 14px; font-weight: 600\">Claws + Mighty Blow<\/span>\n        <span style=\"padding: 8px 12px; border-radius: 10px; background: #F3F6F4; font-size: 14px; font-weight: 600\">Guard + Defensive<\/span>\n        <span style=\"padding: 8px 12px; border-radius: 10px; background: #F3F6F4; font-size: 14px; font-weight: 600\">Wrestle + Evasive<\/span>\n      <\/div>\n    <\/section>\n\n    <section style=\"display: flex; flex-direction: column\">\n      <h2 style=\"margin: 0 0 6px; font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700\">Улучшение характеристик · D8<\/h2>\n      <sc-for list=\"{{d8Rows}}\" as=\"d\" hint-placeholder-count=\"7\">\n        <div style=\"display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; min-height: 44px; border-bottom: 1px solid #E6EBE8\">\n          <span style=\"font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: #2F7A52\">{{d.r}}<\/span>\n          <span style=\"font-size: 15px\">{{d.v}}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n  <\/main>\n<\/div>\n", defaults: {"demoScrolled": false}, factory: function () {

var LEVELS = ['Experienced', 'Veteran', 'Emerging Star', 'Star', 'Superstar', 'Legend'];
var COST = { random: [3, 4, 6, 8, 10, 15], primary: [6, 8, 12, 16, 20, 30], secondary: [10, 12, 16, 20, 24, 34], stat: [14, 16, 20, 24, 28, 38] };
class Component extends DCLogic {
  _hdrRv() {
    return {
      costRows: LEVELS.map(function (name, i) {
        return { name: name, n: i + 1, random: COST.random[i], primary: COST.primary[i], secondary: COST.secondary[i], stat: COST.stat[i] };
      }),
      tvRows: [
        { k: 'Навык Primary', v: '+20k' }, { k: 'Навык Secondary', v: '+40k' },
        { k: 'AV', v: '+10k' }, { k: 'PA', v: '+20k' }, { k: 'MA', v: '+30k' }, { k: 'AG', v: '+40k' }, { k: 'ST', v: '+50k' }
      ],
      d8Rows: [
        { r: '1', v: 'AV +1' }, { r: '2', v: 'AV или PA +1' }, { r: '3–4', v: 'AV, MA или PA +1' },
        { r: '5', v: 'MA или PA +1' }, { r: '6', v: 'AG или MA +1' }, { r: '7', v: 'AG или ST +1' }, { r: '8', v: 'Любая +1' }
      ]
    };
  }
  renderVals() {
    var self = this;
    var mini = !!(this.state && this.state.hdrMini) || !!this.props.demoScrolled;

        if (y > 48 && !on) self.setState({ hdrMini: true });
        else if (y < 8 && on) self.setState({ hdrMini: false });
      }
    });
  }
}

return Component;
} });
