      node.childNodes.forEach(function (c) { out = out.concat(renderNode(c, scope, key, ctr)); });
      return out;
    }

    });

x-end\">\n      <div role=\"dialog\" aria-label=\"{{moneyTitle}}\" style=\"background: #FFFFFF; border-radius: 22px 22px 0 0; display: flex; flex-direction: column\">\n        <div style=\"display: flex; justify-content: center; padding-top: 8px\"><div style=\"width: 40px; height: 5px; border-radius: 3px; background: #C9D3CE\"><\/div><\/div>\n        <div style=\"display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; padding: 6px 12px 4px\">\n          <div style=\"width: 44px\"><\/div>\n          <div style=\"text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.1\">{{moneyTitle}}<\/div>\n          <button onClick=\"{{closeMoney}}\" aria-label=\"Закрыть\" style=\"width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EEF2F0; color: #14201A; display: flex; align-items: center; justify-content: center; cursor: pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n        <\/div>\n        <div style=\"padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 8px\">\n            <button onClick=\"{{amtDec}}\" aria-label=\"Минус 5k\" style=\"width: 48px; height: 48px; border: 0; border-radius: 12px; background: #EEF2F0; font-size: 22px; font-weight: 700; cursor: pointer\">−<\/button>\n            <span style=\"text-align: center; font-family: 'Oswald', sans-serif; font-size: 40px; font-weight: 700; line-height: 1\">{{moneySign}}{{moneyAmount}}k<\/span>\n            <button onClick=\"{{amtInc}}\" aria-label=\"Плюс 5k\" style=\"width: 48px; height: 48px; border: 0; border-radius: 12px; background: #EEF2F0; font-size: 22px; font-weight: 700; cursor: pointer\">+<\/button>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n            <sc-for list=\"{{amtChips}}\" as=\"a\" hint-placeholder-count=\"4\">\n              <button onClick=\"{{a.pick}}\" aria-pressed=\"{{a.sel}}\" style=\"height: 36px; border: 0; border-radius: 18px; background: {{a.bg}}; color: {{a.color}}; box-shadow: {{a.ring}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">{{a.l}}<\/button>\n            <\/sc-for>\n          <\/div>\n          <span style=\"font-size: 13px; font-weight: 600; color: #5F6B65\">За что<\/span>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n            <sc-for list=\"{{moneyReasons}}\" as=\"r\" hint-placeholder-count=\"5\">\n              <button onClick=\"{{r.pick}}\" aria-pressed=\"{{r.sel}}\" style=\"height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: {{r.bg}}; color: {{r.color}}; box-shadow: {{r.ring}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer\">{{r.l}}<\/button>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; border-radius: 12px; background: #F3F6F4; font-size: 14px\"><span style=\"color: #5F6B65\">Казна: {{treasury}}k →<\/span><span style=\"font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: {{moneyAfterColor}}\">{{moneyAfter}}k<\/span><\/div>\n        <\/div>\n        <div style=\"padding: 10px 16px 24px; border-top: 1px solid #E6EBE8\">\n          <button onClick=\"{{applyMoney}}\" disabled=\"{{moneyDisabled}}\" style=\"width: 100%; height: 52px; border: 0; border-radius: 12px; background: {{moneyBg}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer\">{{moneyLabel}}<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>\n", defaults: {"demoPreseason": false, "demoMoney": false, "demoScrolled": false, "review": true}, factory: function () {

// ---- funds2: treasury + team resources with season phase (pre-season / in season) ----
var F2_ACCENT = '#2F7A52';
var F2_RES = [
  { k: 'start', l: 'Start Re-rolls', price: 60, phase: 'pre', min: 0, max: 8,
    note: { pre: '60k · только до старта сезона', season: 'Покупка закрыта — сезон идёт' } },
  { k: 'team', l: 'Team Re-rolls', price: 120, phase: 'season', min: 0, max: 8,
    note: { pre: 'Откроется после старта сезона', season: '120k · докупка по ходу сезона' } },
  { k: 'fans', l: 'Dedicated Fans', price: 10, phase: 'pre', min: 1, max: 6, note: { pre: '10k · только при наборе команды', season: 'Меняется только после матчей' } },
  { k: 'coaches', l: 'Assistant Coaches', price: 10, phase: 'any', min: 0, max: 6, note: { pre: '10k за штуку', season: '10k за штуку' } },
  { k: 'cheer', l: 'Cheerleaders', price: 10, phase: 'any', min: 0, max: 6, note: { pre: '10k за штуку', season: '10k за штуку' } },
  { k: 'bribes', l: 'Bribes', price: 50, phase: 'never', min: 0, max: 3, note: { pre: 'Только для команд с Bribery and Corruption', season: 'Только для команд с Bribery and Corruption' } }
];
var F2_AMOUNTS = [10, 20, 50, 100];
var F2_REASONS = ['Товарищеская игра', 'Спонсор / приз', 'Штраф лиги', 'Покупка', 'Другое'];
var F2_HISTORY = [
  { what: 'Товарищеская игра', when: 'после тура 5', delta: '+20k', color: F2_ACCENT },
  { what: 'Team Re-rolls 2 → 3', when: 'после тура 3', delta: '−120k', color: '#A0473A' },
  { what: 'Победа над Ratwharf Gnawers', when: 'тур 3', delta: '+60k', color: F2_ACCENT },
  { what: 'Assistant Coaches 0 → 1', when: 'до старта сезона', delta: '−10k', color: '#A0473A' }
];
function f2State(props) {
  var pre = !!props.demoPreseason;
  return {
    phase: pre ? 'pre' : 'season', treasury: pre ? 60 : 70,
    res: pre ? { start: 2, team: 0, fans: 1, coaches: 0, cheer: 0, bribes: 0 } : { start: 2, team: 1, fans: 3, coaches: 1, cheer: 1, bribes: 0 },
    bought: {}, apo: !pre, history: pre ? [] : F2_HISTORY, histAll: false,
    money: props.demoMoney ? { sign: 1, amount: 20, reason: 'Товарищеская игра' } : null
  };
}
function f2Vals(self) {
  var st = self.state, pre = st.phase === 'pre';
  var log = function (s, h) { return [h].concat(s.history); };
  var rows = F2_RES.map(function (r) {
    var v = st.res[r.k], locked = r.phase !== 'any' && r.phase !== st.phase;
    var canAfford = st.treasury >= r.price;
    var atMax = v >= r.max, atMin = v <= r.min;
    var boughtNow = st.bought[r.k] || 0;
    var incOff = locked || atMax || !canAfford, decOff = locked || atMin;
    return {
      l: r.l, v: v, locked: locked, open: !locked,
      note: locked ? r.note[st.phase] : (!canAfford && !atMax ? 'Не хватает казны · ' + r.price + 'k' : r.note[st.phase]),
      noteColor: locked ? '#8A948F' : (!canAfford && !atMax ? '#A0473A' : '#5F6B65'),
      nameColor: locked ? '#8A948F' : '#14201A',
      incOff: incOff, decOff: decOff,
      incBg: incOff ? '#F3F6F4' : F2_ACCENT, incColor: incOff ? '#B5BDB9' : '#FFFFFF',
      decColor: decOff ? '#B5BDB9' : '#14201A',
      incAria: 'Купить: ' + r.l, decAria: 'Уменьшить: ' + r.l,
      inc: function () {
        if (incOff) return;
        self.setState(function (s) {
          var res = Object.assign({}, s.res); res[r.k] = v + 1;
          var bought = Object.assign({}, s.bought); bought[r.k] = (bought[r.k] || 0) + 1;
          return { res: res, bought: bought, treasury: s.treasury - r.price,
            history: log(s, { what: r.l + ' ' + v + ' → ' + (v + 1), when: 'только что', delta: r.price ? '−' + r.price + 'k' : 'ресурс', color: r.price ? '#A0473A' : '#5F6B65' }) };
        });
      },
      dec: function () {
        if (decOff) return;
        self.setState(function (s) {
          var res = Object.assign({}, s.res); res[r.k] = v - 1;
          var bought = Object.assign({}, s.bought), refund = (bought[r.k] || 0) > 0 ? r.price : 0;
          if (refund) bought[r.k] -= 1;
          return { res: res, bought: bought, treasury: s.treasury + refund,
            history: log(s, { what: r.l + ' ' + v + ' → ' + (v - 1), when: 'только что', delta: refund ? '+' + refund + 'k' : 'ресурс', color: refund ? F2_ACCENT : '#5F6B65' }) };
        });
      },
      refundHint: boughtNow ? 'отмена покупки вернёт ' + r.price + 'k' : ''
    };
  });
  var m = st.money;
  var amt = m ? Math.max(0, Number(m.amount) || 0) : 0;
  var after = m ? st.treasury + m.sign * amt : st.treasury;
  var bad = !m || amt === 0 || !m.reason || after < 0;
  var chip = function (on) { return { bg: on ? '#17392C' : '#FFFFFF', color: on ? '#FFFFFF' : '#14201A', ring: on ? 'none' : 'inset 0 0 0 1px #C9D3CE', sel: on ? 'true' : 'false' }; };
  var setMoney = function (patch) { self.setState(function (s) { return { money: Object.assign({}, s.money, patch) }; }); };
  var hist = st.histAll ? st.history : st.history.slice(0, 3);
  return {
    phasePre: pre, phaseSeason: !pre,
    phaseLabel: pre ? 'Межсезонье · сезон не начат' : 'Сезон идёт · тур 7',
    phaseBg: pre ? '#FFF4DE' : '#E4F0E9', phaseColor: pre ? '#7A5410' : '#163A28', phaseDot: pre ? '#C99A2E' : F2_ACCENT,
    togglePhase: function () { self.setState(function (s) { return { phase: s.phase === 'pre' ? 'season' : 'pre' }; }); },
    treasury: st.treasury, tvLine: pre ? 'TV 540k · бюджет команды 600k' : 'TV 1 120k · после тура 6',
    resRows: rows,
    apo: st.apo, apoStr: st.apo ? 'true' : 'false', apoTrack: st.apo ? F2_ACCENT : '#C9D3CE', apoKnob: st.apo ? 'translateX(20px)' : 'none',
    apoNote: st.apo ? 'есть · 50k' : (st.treasury >= 50 ? 'нет · купить за 50k' : 'нет · не хватает казны'),
    toggleApo: function () {
      self.setState(function (s) {
        if (!s.apo && s.treasury < 50) return null;
        var refund = s.apo && s.bought.apo ? 50 : 0;
        return { apo: !s.apo, treasury: s.treasury + (s.apo ? refund : -50), bought: Object.assign({}, s.bought, { apo: s.apo ? 0 : 1 }),
          history: log(s, { what: 'Apothecary: ' + (s.apo ? 'нет' : 'есть'), when: 'только что', delta: s.apo ? (refund ? '+50k' : 'ресурс') : '−50k', color: s.apo ? (refund ? F2_ACCENT : '#5F6B65') : '#A0473A' }) };
      });
    },
    history: hist, histEmpty: !st.history.length, histHasMore: st.history.length > 3,
    histToggleLabel: st.histAll ? 'Свернуть' : 'Вся история · ' + st.history.length,
    toggleHist: function () { self.setState(function (s) { return { histAll: !s.histAll }; }); },
    openEdit: function () { self.setState({ money: { sign: 1, amount: 0, reason: 'Другое' } }); },
    openIn: function () { self.setState({ money: { sign: 1, amount: 20, reason: null } }); },
    openOut: function () { self.setState({ money: { sign: -1, amount: 20, reason: null } }); },
    moneyOpen: !!m, closeMoney: function () { self.setState({ money: null }); },
    moneyTitle: m && m.sign < 0 ? 'Списать из казны' : 'Зачислить в казну',
    moneyAmount: amt, moneySign: m && m.sign < 0 ? '−' : '+',
    amtDec: function () { setMoney({ amount: Math.max(0, amt - 5) }); }, amtInc: function () { setMoney({ amount: amt + 5 }); },
    amtChips: F2_AMOUNTS.map(function (a) { return Object.assign(chip(amt === a), { l: a + 'k', pick: function () { setMoney({ amount: a }); } }); }),
    moneyReasons: F2_REASONS.map(function (r) { return Object.assign(chip(m && m.reason === r), { l: r, pick: function () { setMoney({ reason: r }); } }); }),
    moneyAfter: after, moneyAfterColor: after < 0 ? '#A0473A' : '#14201A',
    moneyDisabled: bad, moneyBg: bad ? '#A9B3AE' : (m && m.sign < 0 ? '#A0473A' : F2_ACCENT),
    moneyLabel: !m ? '' : !m.reason ? 'Выберите, за что' : after < 0 ? 'В казне не хватает ' + (-after) + 'k' : (m.sign > 0 ? 'Зачислить ' : 'Списать ') + amt + 'k',
    applyMoney: function () {

      self.setState(function (s) { return { treasury: after, money: null, history: log(s, { what: m.reason, when: 'только что', delta: (m.sign > 0 ? '+' : '−') + amt + 'k', color: m.sign > 0 ? F2_ACCENT : '#A0473A' }) }; });
    }
  };
}

class Component extends DCLogic {
  constructor(props) { super(props); this.state = f2State(props); }

    var v = this._rv09();
