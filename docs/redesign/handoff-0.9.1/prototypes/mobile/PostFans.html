      toggle: function () { var p = {}; p['t_' + k] = !on; self.setState(p); } };

  return v;
}
// ---- /kit ----

var CFG = {"groups": {"roll": {"opts": [1, 2, 3, 4, 5, 6], "val": 4}}, "toggles": {"stall": false, "paint": false}};
function extraVals(self, v, st) {

  return { income: inc, nonStall: st.t_stall ? '0k' : '10k', paintK: st.t_paint ? '15k' : '0k',
