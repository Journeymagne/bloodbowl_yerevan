<script>/* dc-lite — a tiny standalone renderer for Gata League prototype artboards.
   Supports {{path}} lookups, <sc-if>, <sc-for>, <dc-import>, DCLogic setState. */
(function () {
  var DEFS = {};
  var parser = new DOMParser();

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (upd) {
    var s = typeof upd === 'function' ? upd(this.state, this.props) : upd;
    if (s == null) return;
    this.state = Object.assign({}, this.state, s);
    schedule();
  };
  window.DCLogic = DCLogic;

  function define(name, def) {
    var doc = parser.parseFromString('<!doctype html><html><body>' + def.tpl + '</body></html>', 'text/html');
    def.root = doc.body;
    DEFS[name] = def;
  }

  function camel(s) { return s.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); }); }

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return parseFloat(path);
    if (/^'.*'$|^".*"$/.test(path)) return path.slice(1, -1);
    var parts = path.split('.');
    var head = parts[0], v, found = false;
    for (var sc = scope; sc; sc = sc.__parent) {
      if (Object.prototype.hasOwnProperty.call(sc, head)) { v = sc[head]; found = true; break; }
    }
    if (!found) return undefined;
    for (var i = 1; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var PURE = /^\s*\{\{([^}]*)\}\}\s*$/;
  function interp(str, scope) {
    return str.replace(/\{\{([^}]*)\}\}/g, function (_, e) { var v = lookup(e, scope); return v == null ? '' : String(v); });
  }
  function child(scope, vars) { var o = Object.assign({}, vars); o.__parent = scope; return o; }

  var instances = {};
  function instantiate(name, props, key) {
    var def = DEFS[name];
    if (!def) return null;
    var inst = instances[key];
    if (!inst || inst.__name !== name) {
      var full = Object.assign({}, def.defaults, props);
      var Cls = def.factory();
      inst = new Cls(full);
      inst.__name = name;
      instances[key] = inst;
    }
    return inst;
  }

  function renderComponent(name, props, key) {
    var inst = instantiate(name, props, key);
    if (!inst) { var d = document.createElement('div'); d.textContent = 'Missing component ' + name; return [d]; }
    var vals = inst.renderVals ? inst.renderVals() : {};
    var scope = Object.assign({}, vals); scope.__parent = null;
    var out = [];
    var ctr = { n: 0 };
    DEFS[name].root.childNodes.forEach(function (n) { out = out.concat(renderNode(n, scope, key, ctr)); });
    return out;
  }

  function renderNode(node, scope, key, ctr) {
    if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, scope))];
    if (node.nodeType !== 1) return [];
    var tag = node.localName;
    var out = [];
    if (tag === 'sc-if') {
      if (!lookup((node.getAttribute('value') || '').replace(/^\s*\{\{|\}\}\s*$/g, ''), scope)) return [];
      node.childNodes.forEach(function (c) { out = out.concat(renderNode(c, scope, key, ctr)); });
      return out;
    }
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\s*\{\{|\}\}\s*$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var v = {}; v[as] = item; v[as + 'Index'] = i;
        var s = child(scope, v);
        node.childNodes.forEach(function (c) { out = out.concat(renderNode(c, s, key, ctr)); });
      });
      return out;
    }
    if (tag === 'dc-import') {
      var props = {};
      Array.prototype.forEach.call(node.attributes, function (a) {
        if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
        var m = a.value.match(PURE);
        props[camel(a.name)] = m ? lookup(m[1], scope) : a.value;
      });
      var wrap = document.createElement('div');
      wrap.style.display = 'contents';
      renderComponent(node.getAttribute('name'), props, key + '/' + node.getAttribute('name') + (ctr.n++)).forEach(function (n) { wrap.appendChild(n); });
      return [wrap];
    }
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
    var deferred = [];
    Array.prototype.forEach.call(node.attributes, function (a) {
      var name = a.name, val = a.value, m = val.match(PURE);
      if (name.indexOf('on') === 0 && m) {
        var fn = lookup(m[1], scope);
        if (typeof fn === 'function') {
          var ev = name.slice(2).toLowerCase();
          var isText = tag === 'input' && !/^(checkbox|radio)$/i.test(node.getAttribute('type') || '') || tag === 'textarea';
          if (ev === 'change' && isText) ev = 'input';
          el.addEventListener(ev, function (e) { fn(e); });
        }
        return;
      }
      if (name === 'data-optlist') { deferred.push(['options', lookup(val, scope)]); return; }
      if (m) {
        var v = lookup(m[1], scope);
        if (name === 'value') { deferred.push(['value', v]); return; }
        if (name === 'checked') { deferred.push(['checked', !!v]); return; }
        if (v === false || v == null) return;
        if (name === 'disabled' || name === 'selected') { if (v) el.setAttribute(name, ''); return; }
        if (name === 'href' && typeof v === 'string') v = v.replace(/^([A-Za-z0-9]+)\.dc\.html/, '$1.html');
        el.setAttribute(name, v === true ? '' : String(v));
        return;
      }
      if (name === 'value' && (tag === 'select' || tag === 'input')) { deferred.push(['value', interp(val, scope)]); return; }
      el.setAttribute(name, interp(val, scope));
    });
    node.childNodes.forEach(function (c) { renderNode(c, scope, key, ctr).forEach(function (n) { el.appendChild(n); }); });
    deferred.forEach(function (d) {
      if (d[0] === 'options') (d[1] || []).forEach(function (o) { var op = document.createElement('option'); op.value = o.v; op.textContent = o.v; el.appendChild(op); });
    });
    deferred.forEach(function (d) {
      if (d[0] === 'value') { el.value = d[1] == null ? '' : d[1]; if (tag === 'input') el.setAttribute('value', el.value); }
      if (d[0] === 'checked') el.checked = d[1];
    });
    return [el];
  }

  /* --- mount & re-render, keeping scroll positions and focus --- */
  var host, rootName, pending = false;
  function pathOf(el) { var p = []; while (el && el !== host) { var i = 0, s = el; while ((s = s.previousElementSibling)) i++; p.unshift(i); el = el.parentElement; } return p.join('.'); }
  function byPath(p) { var el = host; if (!p) return null; p.split('.').forEach(function (i) { el = el && el.children[+i]; }); return el; }
  function render() {
    pending = false;
    var scrolls = [];
    if (host.firstChild) host.querySelectorAll('*').forEach(function (el) { if (el.scrollTop || el.scrollLeft) scrolls.push([pathOf(el), el.scrollTop, el.scrollLeft]); });
    var act = document.activeElement, focus = null;
    if (act && host.contains(act)) focus = [pathOf(act), act.selectionStart, act.selectionEnd];
    var nodes = renderComponent(rootName, {}, 'root');
    host.innerHTML = '';
    nodes.forEach(function (n) { host.appendChild(n); });
    scrolls.forEach(function (s) { var el = byPath(s[0]); if (el) { el.scrollTop = s[1]; el.scrollLeft = s[2]; } });
    if (focus) { var f = byPath(focus[0]); if (f && f.focus) { f.focus(); try { if (focus[1] != null) f.setSelectionRange(focus[1], focus[2]); } catch (e) {} } }
  }
  function schedule() { if (!pending) { pending = true; (window.queueMicrotask || setTimeout)(render); } }
  window.DC = { define: define, mount: function (name, el) { rootName = name; host = el; render(); } };
})();
</script>

none; color: #A9C4B6\"><path d=\"M8 10l4 4 4-4\"><\/path><\/svg><\/span><sc-if value=\"{{hdrFull}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; color: #CFE0D7; white-space: nowrap\">Люди · 2-е место в лиге<\/span><\/sc-if><\/span>\n    <\/a>\n    <nav aria-label=\"Разделы\" style=\"display: flex; gap: 18px; overflow-x: auto; padding: 0 2px; font-size: 15px; font-weight: 600; scrollbar-width: none; -webkit-mask-image: linear-gradient(to left, #000 85%, transparent); mask-image: linear-gradient(to left, #000 85%, transparent); direction: rtl\">\n      <a href=\"Settings.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Настройки<\/a>\n      <a href=\"Ref.html\" aria-current=\"page\" style=\"color: #FFFFFF; text-decoration: none; padding: 10px 0 9px; white-space: nowrap; border-bottom: 3px solid #FFFFFF; direction: ltr\">Справочник<\/a>\n      <a href=\"League.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Таблица<\/a>\n      <a href=\"Matches.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Матчи<\/a>\n      <a href=\"Stats.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Состав<\/a>\n      <a href=\"TeamManage.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Команда<\/a>\n      <a href=\"Team.html\" style=\"color: #A9C4B6; text-decoration: none; padding: 10px 0 12px; white-space: nowrap; direction: ltr\">Обзор<\/a>\n    <\/nav>\n  <\/header>\n\n  <main onScroll=\"{{onMainScroll}}\" style=\"flex: 1 1 auto; overflow-y: auto; padding-bottom: 28px; position: relative; z-index: 0\">\n    <div style=\"padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px\">\n      <a href=\"Ref.html\" style=\"align-self: flex-start; min-height: 32px; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #2F7A52; text-decoration: none\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"><\/path><\/svg>Справочник\n      <\/a>\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px\">\n        <h1 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; line-height: 1\">Навыки<\/h1>\n        <span style=\"font-size: 14px; color: #5F6B65\">{{countLabel}}<\/span>\n      <\/div>\n      <label style=\"display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #F3F6F4; color: #5F6B65\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-3.5-3.5\"><\/path><\/svg>\n        <input type=\"search\" aria-label=\"Поиск навыка\" placeholder=\"Найти навык\" value=\"{{query}}\" onChange=\"{{onSearch}}\" style=\"flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 16px; color: #14201A; outline: none\">\n      <\/label>\n    <\/div>\n\n    <div role=\"radiogroup\" aria-label=\"Категория\" style=\"display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px 10px\">\n      <sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"7\">\n        <button onClick=\"{{c.pick}}\" role=\"radio\" aria-checked=\"{{c.checked}}\" style=\"flex: none; height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: {{c.bg}}; color: {{c.color}}; box-shadow: {{c.ring}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px\">{{c.label}}<span style=\"font-size: 12px; opacity: 0.75\">{{c.n}}<\/span><\/button>\n      <\/sc-for>\n    <\/div>\n\n    <div style=\"padding: 0 16px\">\n      <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"12\">\n        <div style=\"display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid #E6EBE8\">\n          <span style=\"width: 28px; height: 28px; border-radius: 8px; background: {{r.bg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700\">{{r.letter}}<\/span>\n          <span style=\"font-size: 16px; font-weight: 500\">{{r.n}}<\/span>\n          <span style=\"font-size: 12px; font-weight: 600; color: {{r.typeColor}}\">{{r.type}}<\/span>\n        <\/div>\n      <\/sc-for>\n      <sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 24px 0; text-align: center; font-size: 15px; color: #5F6B65\">Ничего не найдено<\/div>\n      <\/sc-if>\n    <\/div>\n  <\/main>\n<\/div>\n", defaults: {"demoScrolled": false}, factory: function () {

var CATS = [
  { k: 'A', n: 'Agility',  bg: '#2E6E8E', list: 'Catch|Defensive|Diving Catch|Diving Tackle|Dodge|Evasive|Fumblerooskie|Hit and Run|Jump Up|Leap|Safe Pair of Hands|Sidestep|Sprint' },
  { k: 'D', n: 'Devious',  bg: '#5B3F78', list: 'Dirty Player|Eye Gouge|Lethal Flight|Lone Fouler|Put the Boot In|Quick Foul|Saboteur|Shiv|Sneaky Git' },
  { k: 'G', n: 'General',  bg: '#17392C', list: 'Block|Chaotic Impulse|Dauntless|Dump-off|Elvenball|Explosive Demise|Fend|Frenzy|Hail Mary Pass|Kick|Nerves of Steel|Offensive|Prehensile Tail|Pro|Shadowing|Steady Footing|Strip Ball|Sure Feet|Sure Hands|Tackle|Taunt|Thick Skull|Two Heads|Very Stupid|Wrestle' },
  { k: 'M', n: 'Mutation', bg: '#6B5A1E', list: 'Big Hand|Bone Hook|Claws|Disturbing Presence|Extra Arms|Foul Appearance|Horns|Iron Hard Skin|Monstrous Mouth|Tentacles|Very Long Legs' },
  { k: 'P', n: 'Passing',  bg: '#8A5A12', list: 'Accurate|Cannoneer|Cloud Burster|Give and Go|Leader|On the Ball|Pass|Punt|Safe Pass|Strong Wrist' },
  { k: 'S', n: 'Strength', bg: '#7B2E2E', list: 'Arm Bar|Brawler|Break Tackle|Bullseye|Grab|Guard|Juggernaut|Mighty Blow|Mighty Blow (+1)|Mighty Blow (+2)|Multiple Block|Pile Driver|Stand Firm|Strong Arm' }
];
var PASSIVE = { 'Thick Skull': true };
var ALL = [];
CATS.forEach(function (c) {
  c.list.split('|').forEach(function (n) { ALL.push({ n: n, k: c.k, bg: c.bg }); });
});
ALL.sort(function (a, b) { return a.n.localeCompare(b.n); });

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all', query: '' };
  }
  _hdrRv() {
    var self = this, st = this.state;
    var q = st.query.trim().toLowerCase();
    var rows = ALL.filter(function (s) {
      return (st.cat === 'all' || s.k === st.cat) && (!q || s.n.toLowerCase().indexOf(q) !== -1);
    }).map(function (s) {
      var pas = !!PASSIVE[s.n];
      return { n: s.n, letter: s.k, bg: s.bg, type: pas ? 'Passive' : 'Active', typeColor: pas ? '#A0473A' : '#5F6B65' };
    });
    var chipDefs = [{ k: 'all', label: 'Все', n: ALL.length }].concat(CATS.map(function (c) {
      return { k: c.k, label: c.n, n: c.list.split('|').length };
    }));
    var chips = chipDefs.map(function (c) {
      var on = st.cat === c.k;
      return {
        label: c.label, n: c.n, checked: on ? 'true' : 'false',
        bg: on ? '#17392C' : '#FFFFFF', color: on ? '#FFFFFF' : '#14201A',
        ring: on ? 'none' : 'inset 0 0 0 1px #C9D3CE',
        pick: function () { self.setState({ cat: c.k }); }
      };
    });
    return {
      rows: rows, chips: chips, empty: rows.length === 0,
      query: st.query,
      countLabel: rows.length + ' из ' + ALL.length,
      onSearch: function (e) { self.setState({ query: e.target.value }); }
    };
  }
  renderVals() {
    var self = this;
    var mini = !!(this.state && this.state.hdrMini) || !!this.props.demoScrolled;
    return Object.assign(this._hdrRv(), {
      hdrMini: mini, hdrFull: !mini, hdrCrestW: mini ? 24 : 34, hdrCrestH: mini ? 27 : 39,
      hdrNameSize: mini ? '18px' : '22px', hdrPadTop: mini ? '6px' : '10px',
      onMainScroll: function (e) {
        var y = e.target.scrollTop, on = !!(self.state && self.state.hdrMini);
        if (y > 48 && !on) self.setState({ hdrMini: true });
        else if (y < 8 && on) self.setState({ hdrMini: false });
      }
    });
  }
}

return Component;
} });
